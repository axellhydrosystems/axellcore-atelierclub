name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p /tmp/build/axellcore-atelierclub
          rsync -r --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='vendor/' --exclude='tests/' --exclude='*.zip' \
            . /tmp/build/axellcore-atelierclub/
          cd /tmp/build
          zip -r axellcore-atelierclub.zip axellcore-atelierclub

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/build/axellcore-atelierclub.zip
          generate_release_notes: true
